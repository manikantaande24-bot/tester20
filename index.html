<!DOCTYPE html>
<html lang="en" class="intro-locked">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marcelle &amp; Antoine — Wedding Invitation</title>
<meta name="description" content="You're invited to Marcelle & Antoine's Wedding. Scratch the golden heart to reveal the wedding date.">
<meta name="theme-color" content="#08080f">

<link rel="icon" href="data:,">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Italiana&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">

<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --bg-deep:      #08080f;
  --bg-mid:       #1f1b38;

  --ivory:        #f5f1e6;
  --ink:          #2a1a10;
  --ink-soft:     #6a4a38;

  --rose-1:       #fce6d4;
  --rose-2:       #e8b898;
  --rose-3:       #d49a78;
  --rose-4:       #c47a58;
  --rose-5:       #a85a3a;

  --gold:         #d4af7a;
  --gold-soft:    #c49a70;
  --gold-deep:    #a87a50;

  --champagne:    #e8d8b8;
  --champagne-d:  rgba(232,216,184,.75);

  --star:         rgba(230,225,255,.9);

  --ease-out:     cubic-bezier(.16,1,.3,1);
}

/* ============================================================
   BASE
   ============================================================ */
*,*::before,*::after{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color: transparent;
}
html{
  -webkit-text-size-adjust:100%;
  width:100%;
  max-width:100%;
  overflow-x:clip;
}
html.intro-locked,
html.intro-locked body{
  overflow:hidden;
  height:100%;
}

body{
  min-height:100%;
  width:100%;
  max-width:100%;
  margin:0;
  background:var(--bg-deep);
  color:var(--ivory);
  font-family:'Cormorant Garamond', Georgia, serif;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  overflow-x:clip;
}

button,
a,
[role="button"]{
  outline: none;
  -webkit-tap-highlight-color: transparent;
}
button:focus-visible,
a:focus-visible,
[role="button"]:focus-visible{
  outline: 2px solid rgba(232,216,184,.7);
  outline-offset: 3px;
}

.sr-only{
  position:absolute; width:1px; height:1px;
  padding:0; margin:-1px; overflow:hidden;
  clip:rect(0 0 0 0); clip-path:inset(50%);
  white-space:nowrap; border:0;
}

/* ============================================================
   STARFIELD + VIGNETTE
   ============================================================ */
.stars,
.stars::before,
.stars::after{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
}

.stars{
  background:
    radial-gradient(ellipse 90% 60% at 50% 0%, #1f1b38 0%, #08080f 72%);
}

.stars::before{
  content:'';
  background-image:
    radial-gradient(1.2px 1.2px at  6% 14%, var(--star), transparent 55%),
    radial-gradient(1px   1px   at 18% 32%, rgba(255,255,255,.65), transparent 55%),
    radial-gradient(1.6px 1.6px at 26%  7%, rgba(230,225,255,.85), transparent 55%),
    radial-gradient(1px   1px   at 34% 46%, rgba(255,255,255,.55), transparent 55%),
    radial-gradient(1.2px 1.2px at 42% 22%, var(--star), transparent 55%),
    radial-gradient(1px   1px   at 51% 68%, rgba(255,255,255,.6),  transparent 55%),
    radial-gradient(1.8px 1.8px at 58% 12%, rgba(230,225,255,.85), transparent 55%),
    radial-gradient(1px   1px   at 66% 42%, rgba(255,255,255,.5),  transparent 55%),
    radial-gradient(1.4px 1.4px at 74% 28%, var(--star), transparent 55%),
    radial-gradient(1px   1px   at 82% 58%, rgba(255,255,255,.65), transparent 55%),
    radial-gradient(1.2px 1.2px at 91% 18%, rgba(230,225,255,.85), transparent 55%),
    radial-gradient(1px   1px   at 96% 46%, rgba(255,255,255,.55), transparent 55%),
    radial-gradient(1px   1px   at 12% 62%, rgba(255,255,255,.55), transparent 55%),
    radial-gradient(1.4px 1.4px at 22% 82%, var(--star), transparent 55%),
    radial-gradient(1px   1px   at 38% 88%, rgba(255,255,255,.6),  transparent 55%),
    radial-gradient(1.6px 1.6px at 47% 74%, rgba(230,225,255,.8),  transparent 55%),
    radial-gradient(1px   1px   at 55% 92%, rgba(255,255,255,.5),  transparent 55%),
    radial-gradient(1.2px 1.2px at 68% 78%, var(--star), transparent 55%),
    radial-gradient(1px   1px   at 78% 88%, rgba(255,255,255,.6),  transparent 55%),
    radial-gradient(1.4px 1.4px at 88% 72%, rgba(230,225,255,.85), transparent 55%),
    radial-gradient(1px   1px   at 93% 92%, rgba(255,255,255,.5),  transparent 55%),
    radial-gradient(1px   1px   at  4% 44%, rgba(255,255,255,.5),  transparent 55%),
    radial-gradient(1.2px 1.2px at 30% 60%, rgba(230,225,255,.8),  transparent 55%),
    radial-gradient(1px   1px   at 62% 58%, rgba(255,255,255,.55), transparent 55%),
    radial-gradient(1px   1px   at 86% 42%, rgba(255,255,255,.65), transparent 55%);
  animation:starTwinkle 7s ease-in-out infinite alternate;
}
@keyframes starTwinkle{
  0%   { opacity:.65; }
  50%  { opacity:1;   }
  100% { opacity:.75; }
}

.stars::after{
  content:'';
  background:
    radial-gradient(ellipse 100% 55% at 50% -8%, rgba(180,140,200,.18) 0%, transparent 60%),
    radial-gradient(ellipse 90% 90% at 50% 50%, transparent 40%, rgba(0,0,0,.6) 100%);
}

/* ============================================================
   INTRO SCREEN
   ============================================================ */
.intro-screen{
  position:fixed;
  inset:0;
  z-index:20000;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:
    radial-gradient(ellipse 85% 65% at 50% 44%, #1d1836 0%, #0b0a14 60%, #08080f 100%);
  transition:
    opacity  1.1s var(--ease-out),
    transform 1.1s var(--ease-out),
    filter   1.1s var(--ease-out),
    visibility 0s linear 1.1s;
  will-change:opacity, transform, filter;
}

.intro-screen.is-hidden{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transform:scale(1.08);
  filter:blur(10px);
}

/* ============================================================
   ENVELOPE
   ============================================================ */
.envelope-wrapper{
  position:relative;
  width:min(340px, 86vw);
  aspect-ratio:7 / 5;
  cursor:pointer;
  outline:none;
  -webkit-tap-highlight-color:transparent;
  animation:envelopeFloat 5s ease-in-out infinite;
  will-change:transform;
}
.envelope-wrapper.open,
.envelope-wrapper.is-leaving{
  animation:none;
}
@keyframes envelopeFloat{
  0%,100%{ transform:translateY(0); }
  50%    { transform:translateY(-9px); }
}

/* NOTE: perspective only — no `transform-style: preserve-3d`.
   preserve-3d made the browser sort children by their 3D Z position
   instead of z-index, which is what pushed the invitation card
   behind the flap / pocket and hid its text. */
.envelope{
  position:absolute;
  inset:0;
  border-radius:8px;
  background:linear-gradient(165deg,#2b2442 0%,#1a1530 58%,#120e1e 100%);
  box-shadow:
    0 26px 60px rgba(0,0,0,.65),
    0 0 0 1px rgba(232,216,184,.16),
    inset 0 1px 0 rgba(255,255,255,.06);
  perspective:1400px;
}

/* ---- top flap (triangle that flips open) ---- */
.envelope-flap{
  position:absolute;
  top:0; left:0;
  width:100%;
  height:54%;
  background:linear-gradient(180deg,#3a3159 0%,#272040 55%,#1c1730 100%);
  clip-path:polygon(0 0, 100% 0, 50% 100%);
  transform-origin:top center;
  transform:rotateX(0deg);
  transition:transform 1.15s cubic-bezier(.6,.02,.3,1);
  z-index:6;
  backface-visibility:visible;
}
.envelope-wrapper.open .envelope-flap{
  transform:rotateX(180deg);
}
/* Once the flap has swung past vertical it drops behind everything,
   so the card can rise in front of it instead of behind it. */
.envelope-wrapper.flap-behind .envelope-flap{
  z-index:1;
}

/* ---- front pocket ---- */
.envelope-pocket{
  position:absolute;
  inset:0;
  z-index:5;
  border-radius:0 0 8px 8px;
  background:linear-gradient(180deg,#272040 0%,#1b1630 55%,#15111f 100%);
  clip-path:polygon(0 100%, 0 30%, 50% 68%, 100% 30%, 100% 100%);
  filter:drop-shadow(0 -1px 0 rgba(232,216,184,.16));
  pointer-events:none;
}

/* ---- invitation card ---- */
.invitation-card{
  position:absolute;
  left:6%;
  top:8%;
  width:88%;
  height:84%;
  z-index:3;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:18px 14px;
  text-align:center;
  color:var(--ink);
  border-radius:4px;
  border:1px solid var(--gold-soft);
  background:linear-gradient(135deg,#fdfaf2 0%,#f7f1e3 55%,#efe6d3 100%);
  box-shadow:0 12px 32px rgba(0,0,0,.4);

  /* Initially tucked inside the envelope */
  opacity:0;
  transform:translateY(26px) scale(.94);
  transition:
    transform 1.5s var(--ease-out) .45s,
    opacity   1.1s ease            .45s;
  will-change:transform, opacity;
}

.envelope-wrapper.open .invitation-card{
  opacity:1;
  transform:translateY(-54%) scale(1.03);
  cursor:default;
}

.envelope-wrapper.is-leaving .invitation-card{
  transform:translateY(-54%) scale(1.16);
  opacity:0;
  transition:
    transform 1s   cubic-bezier(.4,0,.2,1),
    opacity   .85s ease;
}

.card-title{
  font-family:'Jost', sans-serif;
  font-size:10px;
  letter-spacing:3.5px;
  text-transform:uppercase;
  color:var(--ink-soft);
}

.card-names{
  font-family:'Italiana', serif;
  font-weight:400;
  font-size:clamp(17px, 5.2vw, 22px);
  line-height:1.3;
  color:var(--ink);
}

/* ---- wax seal ---- */
.wax-seal{
  position:absolute;
  left:50%;
  top:54%;
  z-index:7;
  width:clamp(44px, 13vw, 52px);
  aspect-ratio:1;
  display:grid;
  place-items:center;
  border-radius:50%;
  font-family:'Italiana', serif;
  font-size:clamp(13px, 4vw, 16px);
  letter-spacing:.5px;
  color:#f8e8d6;
  text-shadow:0 1px 1px rgba(0,0,0,.5);
  background:radial-gradient(circle at 35% 28%,
              #dd9070 0%, #c06a44 42%, #93472a 72%, #5f2713 100%);
  box-shadow:
    0 6px 16px rgba(0,0,0,.5),
    inset 0 2px 4px rgba(255,255,255,.28),
    inset 0 -4px 8px rgba(0,0,0,.4);
  transform:translate(-50%,-50%) scale(1) rotate(0deg);
  transition:opacity .45s ease, transform .6s cubic-bezier(.4,0,.2,1);
  pointer-events:none;
}
.envelope-wrapper.open .wax-seal{
  opacity:0;
  transform:translate(-50%,-50%) scale(.35) rotate(-22deg);
}

/* ---- hint under the envelope ---- */
.envelope-hint{
  margin-top:46px;
  font-family:'Jost', sans-serif;
  font-size:10px;
  font-weight:400;
  letter-spacing:4px;
  text-transform:uppercase;
  text-align:center;
  color:var(--champagne);
  animation:hintPulse 2.8s ease-in-out infinite;
  transition:opacity .45s ease;
}
.envelope-hint.is-hidden{
  opacity:0 !important;
  animation:none !important;
  pointer-events:none;
}

/* ============================================================
   LAYOUT
   ============================================================ */
.invite{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  max-width:100%;
  min-height:100vh;
  min-height:100dvh;
  padding:48px 20px 60px;
  overflow-x:clip;
}

.invite-inner{
  display:flex;
  flex-direction:column;
  align-items:center;
  width:100%;
  max-width:420px;
  min-width:0;
  text-align:center;
  opacity:0;
  transform:translateY(20px);
}

.invite-inner.is-visible {
  animation:fadeUp 1.6s var(--ease-out) forwards;
}

@keyframes fadeUp{ to{ opacity:1; transform:translateY(0); } }

/* ============================================================
   EYEBROW
   ============================================================ */
.eyebrow{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  font-family:'Jost', sans-serif;
  font-size:10.5px;
  font-weight:400;
  letter-spacing:5px;
  text-transform:uppercase;
  color:var(--champagne);
  margin-bottom:26px;
}
.eyebrow .dot{
  display:block;
  width:3px; height:3px;
  background:var(--champagne);
  transform:rotate(45deg);
  opacity:.85;
}

/* ============================================================
   NAMES
   ============================================================ */
.names{
  width:100%;
  max-width:100%;
  min-width:0;
  font-family:'Italiana', serif;
  font-weight:400;
  font-size:clamp(28px, 8.5vw, 58px);
  line-height:1.05;
  letter-spacing:1px;
  color:var(--ivory);
  margin-bottom:18px;
  white-space:nowrap;
}
.names .amp{
  display:inline-block;
  font-family:'Cormorant Garamond', serif;
  font-style:italic;
  font-weight:300;
  font-size:.78em;
  color:var(--champagne);
  letter-spacing:0;
  margin:0 6px;
  vertical-align:middle;
}

/* ============================================================
   ORNAMENT RULE
   ============================================================ */
.rule{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  margin-bottom:30px;
}
.rule-line{
  display:block;
  width:52px;
  height:1px;
  background:linear-gradient(to right, transparent, rgba(232,216,184,.6), transparent);
}
.rule-gem{
  display:block;
  width:5px;
  height:5px;
  background:var(--champagne);
  transform:rotate(45deg);
  opacity:.85;
  box-shadow:0 0 10px rgba(232,216,184,.6);
}

/* ============================================================
   HEART
   ============================================================ */
.heart-wrap{
  position:relative;
  width:min(310px, calc(100vw - 52px));
  aspect-ratio:1 / 1;
  flex-shrink:0;
  cursor:pointer;
  outline:none;
  -webkit-tap-highlight-color:transparent;
  margin-bottom:26px;
}
.heart-wrap:focus-visible{
  filter:drop-shadow(0 0 3px rgba(240,220,190,.9));
}

.heart-svg{
  display:block;
  width:100%;
  height:100%;
  overflow:visible;
  position:relative;
  z-index:1;
}

.heart-glow{
  position:absolute;
  inset:-40px;
  z-index:0;
  pointer-events:none;
  background:radial-gradient(circle at 50% 55%,
              rgba(240,190,150,.32) 0%,
              rgba(230,160,120,.14) 40%,
              transparent 68%);
  animation:glowPulse 4.2s ease-in-out infinite;
}
@keyframes glowPulse{
  0%,100%{ opacity:.7; transform:scale(1);    }
  50%    { opacity:1;  transform:scale(1.06); }
}

.cvs-wrap{
  position:absolute;
  inset:0;
  z-index:3;
}
.scratch-cvs{
  display:block;
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  touch-action:none;
  cursor:pointer;
}

.shimmer{
  position:absolute;
  inset:0;
  z-index:4;
  pointer-events:none;

  background:linear-gradient(
    90deg,
    rgba(255,220,180,0) 0%,
    rgba(255,220,180,0) 36%,
    rgba(255,255,240,.92) 50%,
    rgba(255,220,180,0) 64%,
    rgba(255,220,180,0) 100%
  );

  background-size:320% 100%;
  background-position:100% 50%;

  animation:shimmerMove 2.8s linear infinite;
  transition:opacity .55s ease;
}

@keyframes shimmerMove{
  0%{ background-position:100% 50%; }
  100%{ background-position:0% 50%; }
}

.sparkle-layer{
  position:absolute;
  inset:0;
  z-index:2;
  overflow:hidden;
  pointer-events:none;
}
.sp{
  position:absolute;
  border-radius:50%;
  background:radial-gradient(circle, #fff8e8 0%, #e8c090 55%, transparent 100%);
  opacity:0;
  animation:spAnim var(--d,2s) ease-in-out var(--dl,0s) infinite;
}
.sp.star::before,
.sp.star::after{
  content:'';
  position:absolute;
  background:#fff0d4;
  border-radius:1px;
  box-shadow:0 0 4px rgba(255,224,180,.8);
}
.sp.star::before{ width:1px;  height:10px; top:-3px; left:calc(50% - .5px); }
.sp.star::after { width:10px; height:1px;  top:calc(50% - .5px); left:-3px; }
@keyframes spAnim{
  0%,100%{ opacity:0;   transform:scale(.3) rotate(0deg);   }
  40%,60%{ opacity:.95; transform:scale(1.2) rotate(18deg); }
}

/* ============================================================
   HINT
   ============================================================ */
.hint{
  font-family:'Jost', sans-serif;
  font-size:10px;
  font-weight:400;
  letter-spacing:4.5px;
  text-transform:uppercase;
  color:var(--champagne);
  opacity:.85;
  margin-bottom:30px;
  transition:opacity .5s ease;
  animation:hintPulse 2.8s ease-in-out 1.8s infinite;
}
@keyframes hintPulse {
  0%, 100% { opacity: .4; }
  50% { opacity: 1; }
}
.hint.is-hidden {
  opacity: 0 !important;
  animation: none !important;
  pointer-events: none;
  visibility: hidden;
}

/* ============================================================
   FOOTER & LOCATION BUTTON
   ============================================================ */
.footer{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;
}
.footer-rule{
  display:flex;
  align-items:center;
  gap:12px;
  opacity:.7;
}
.footer-rule .line{
  display:block;
  width:36px;
  height:1px;
  background:linear-gradient(to right, transparent, rgba(232,216,184,.7), transparent);
}
.footer-rule .gem{
  font-size:7px;
  color:var(--champagne);
  line-height:1;
}
.footer-note{
  font-family:'Jost', sans-serif;
  font-size:9.5px;
  font-weight:300;
  letter-spacing:4px;
  text-transform:uppercase;
  color:var(--champagne-d);
  opacity:.8;
}

.location-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: 'Jost', sans-serif;
  font-size: 10px;
  font-weight: 400;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--champagne);
  text-decoration: none;
  padding: 8px 18px;
  border: 1px solid rgba(232, 216, 184, 0.4);
  border-radius: 20px;
  transition: all 0.3s ease;
  background: rgba(8, 8, 15, 0.4);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  -webkit-tap-highlight-color: transparent;
}
.location-btn:hover {
  border-color: var(--champagne);
  background: rgba(232, 216, 184, 0.15);
  color: #fff;
}

/* ============================================================
   MUSIC TOGGLE
   ============================================================ */
.music-btn {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 10000;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: rgba(8, 8, 15, 0.6);
  border: 1px solid rgba(232, 216, 184, 0.4);
  color: var(--champagne);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  transition: all 0.3s ease;
  outline: none;
  -webkit-tap-highlight-color: transparent;
  opacity:0;
  pointer-events:none;
}
body.invite-open .music-btn{
  opacity:1;
  pointer-events:auto;
  transition:opacity .8s ease .4s, border-color .3s ease, background .3s ease, transform .3s ease;
}
.music-btn:hover {
  border-color: var(--champagne);
  background: rgba(8, 8, 15, 0.9);
  transform: scale(1.05);
}
.music-btn svg {
  width: 20px;
  height: 20px;
  fill: currentColor;
}

/* ============================================================
   CONFETTI
   ============================================================ */
#confetti{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:99999;
}

/* ============================================================
   REDUCED MOTION
   ============================================================ */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
    transition-delay:0s !important;
  }
  .invite-inner{ opacity:1; transform:none; }
  .heart-glow{ opacity:.8; }
  .shimmer{ display:none; }
  .envelope-wrapper{ animation:none; }
}
</style>
</head>

<body>

<!-- Background Music -->
<audio id="bg-music" loop preload="auto">
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<!-- Music Toggle Button -->
<button class="music-btn" id="music-toggle" type="button" aria-label="Toggle background music">
  <svg id="icon-on" viewBox="0 0 24 24" style="display:block;" aria-hidden="true">
    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
  </svg>
  <svg id="icon-off" viewBox="0 0 24 24" style="display:none;" aria-hidden="true">

<p class="sr-only" role="status" aria-live="polite" id="live"></p>

<script>
(function () {
  'use strict';

  /* ==========================================================
     CONFIG
     ========================================================== */
  var SVG_W = 320;
  var SVG_H = 320;

  var HEART_PATH =
    'M160 288 C160 288 16 192 16 104 C16 56 54 20 100 20 ' +
    'C126 20 148 34 160 56 C172 34 194 20 220 20 ' +
    'C266 20 304 56 304 104 C304 192 160 288 160 288Z';

  var REVEAL_THRESHOLD = 0.60;
  var BRUSH_RADIUS     = 26;
  var CHECK_INTERVAL   = 220;
  var DPR_CAP          = 2;

  /* --- INTRO TIMING ---------------------------------------
     How long the opened card stays on screen before the
     invitation fades in. Lower = faster, higher = slower.   */
  var INTRO_HOLD_MS       = 3600;
  var INTRO_HOLD_REDUCED  = 1200;   // when prefers-reduced-motion
  var FLAP_BEHIND_DELAY   = 620;    // flap swings past vertical → drop behind card
  var SKIP_GUARD_MS       = 700;    // ignore "skip" clicks right after opening

  /* ==========================================================
     ELEMENTS
     ========================================================== */
  var wrapEl        = document.getElementById('heart-wrap');
  var cvs           = document.getElementById('scratch-cvs');
  var ctx           = cvs.getContext('2d', { willReadFrequently: true });
  var shimmerEl     = document.getElementById('shimmer');
  var hintEl        = document.getElementById('hint');
  var sparkWrap     = document.getElementById('sparkle-layer');
  var liveEl        = document.getElementById('live');
  var introScreen   = document.getElementById('intro-screen');
  var envelopeWrap  = document.getElementById('envelope-wrapper');
  var envelopeHint  = document.getElementById('envelope-hint');
  var inviteInner   = document.getElementById('invite-inner');

  var prefersReduced = window.matchMedia &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ==========================================================
     STATE
     ========================================================== */
  var dpr            = 1;
  var isDrawing      = false;
  var revealed       = false;
  var lastPoint      = null;
  var lastCheckTime  = 0;
  var lastWidth      = 0;
  var baselineClear  = -1;

  var envelopeOpened = false;
  var entered        = false;
  var openedAt       = 0;

  /* ==========================================================
     MUSIC
     ========================================================== */
  var audio          = document.getElementById('bg-music');
  var musicBtn       = document.getElementById('music-toggle');
  var iconOn         = document.getElementById('icon-on');
  var iconOff        = document.getElementById('icon-off');
  var isMusicPlaying = false;

  audio.volume = 0.4;

  function updateMusicUI () {
    if (isMusicPlaying) {
      iconOn.style.display  = 'block';
      iconOff.style.display = 'none';
      musicBtn.setAttribute('aria-label', 'Turn music off');
    } else {
      iconOn.style.display  = 'none';
      iconOff.style.display = 'block';
      musicBtn.setAttribute('aria-label', 'Turn music on');
    }
  }

  function playMusic () {
    var p = audio.play();
    if (p && typeof p.then === 'function') {
      p.then(function () {
        isMusicPlaying = true;
        updateMusicUI();
      }).catch(function () {
        isMusicPlaying = false;
        updateMusicUI();
      });
    } else {
      isMusicPlaying = true;
      updateMusicUI();
    }
  }

  function pauseMusic () {
    audio.pause();
    isMusicPlaying = false;
    updateMusicUI();
  }

  musicBtn.addEventListener('click', function (e) {
    e.preventDefault();
    e.stopPropagation();
    if (isMusicPlaying) pauseMusic(); else playMusic();
  });

  audio.addEventListener('pause', function () {
    isMusicPlaying = false;
    updateMusicUI();
  });
  audio.addEventListener('play', function () {
    isMusicPlaying = true;
    updateMusicUI();
  });

  updateMusicUI();

  /* ==========================================================
     INTRO — ENVELOPE SEQUENCE
     ========================================================== */
  function openEnvelope () {
    if (envelopeOpened || entered) return;
    envelopeOpened = true;
    openedAt = Date.now();

    envelopeWrap.classList.add('open');
    envelopeHint.classList.add('is-hidden');
    playMusic();

    /* The flap must drop behind the card once it has swung past
       vertical, otherwise it covers the rising card. */
    setTimeout(function () {
      envelopeWrap.classList.add('flap-behind');
    }, FLAP_BEHIND_DELAY);

    /* Let the card be seen for a while before we move on. */
    setTimeout(enterInvitation, prefersReduced ? INTRO_HOLD_REDUCED : INTRO_HOLD_MS);
  }

  function enterInvitation () {
    if (entered) return;
    entered = true;

    /* Card zooms out of the envelope + intro fades/blurs away */
    envelopeWrap.classList.add('is-leaving');
    introScreen.classList.add('is-hidden');
    introScreen.setAttribute('aria-hidden', 'true');

    /* Unlock the page */
    document.documentElement.classList.remove('intro-locked');
    document.body.classList.add('invite-open');
    window.scrollTo(0, 0);

    /* Fade the hero in */
    inviteInner.classList.add('is-visible');

    /* Re-measure the heart once the intro is gone */
    setTimeout(function () {
      updateShimmerClip();
      sizeCanvas(true);
    }, 500);
  }

  envelopeWrap.addEventListener('click', function () {
    if (!envelopeOpened) openEnvelope();
  });

  envelopeWrap.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
      e.preventDefault();
      if (!envelopeOpened) openEnvelope();
    }
  });

  /* Tap anywhere on the intro to skip the wait.
     The guard stops the very first tap (the one that opens the
     envelope) from skipping straight past the animation. */
  introScreen.addEventListener('click', function () {
    if (!envelopeOpened || entered) return;
    if (Date.now() - openedAt < SKIP_GUARD_MS) return;
    enterInvitation();
  });

  /* ==========================================================
     SPARKLES
     ========================================================== */
  (function buildSparkles () {
    var positions = [
      [31, 6], [40, 10], [50, 17], [60, 10], [69, 6],
      [85, 17], [95, 32], [88, 47], [75, 59], [65, 76],
      [50, 90],
      [35, 76], [25, 59], [12, 47], [5, 32], [15, 17],
      [40, 40], [60, 40], [50, 62], [35, 52], [65, 52]
    ];

    var frag = document.createDocumentFragment();

    positions.forEach(function (p, i) {
      var el = document.createElement('div');
      var isStar = (i % 3 === 0);
      var size = isStar ? 4 : 3;

      el.className = 'sp' + (isStar ? ' star' : '');
      el.style.left   = p[0] + '%';
      el.style.top    = p[1] + '%';
      el.style.width  = size + 'px';
      el.style.height = size + 'px';
      el.style.setProperty('--d',  (2 + Math.random() * 2.8).toFixed(2) + 's');
      el.style.setProperty('--dl', (Math.random() * 3.5).toFixed(2) + 's');

      frag.appendChild(el);
    });

    sparkWrap.appendChild(frag);
  })();

  /* ==========================================================
     SHIMMER CLIP
     ========================================================== */
  function updateShimmerClip () {
    var w = wrapEl.getBoundingClientRect().width;
    if (!w) return;

    var s = w / SVG_W;
    var p =
      'M' + 160*s + ' ' + 288*s +
      ' C' + 160*s + ' ' + 288*s + ' ' +  16*s + ' ' + 192*s + ' ' +  16*s + ' ' + 104*s +
      ' C' +  16*s + ' ' +  56*s + ' ' +  54*s + ' ' +  20*s + ' ' + 100*s + ' ' +  20*s +
      ' C' + 126*s + ' ' +  20*s + ' ' + 148*s + ' ' +  34*s + ' ' + 160*s + ' ' +  56*s +
      ' C' + 172*s + ' ' +  34*s + ' ' + 194*s + ' ' +  20*s + ' ' + 220*s + ' ' +  20*s +
      ' C' + 266*s + ' ' +  20*s + ' ' + 304*s + ' ' +  56*s + ' ' + 304*s + ' ' + 104*s +
      ' C' + 304*s + ' ' + 192*s + ' ' + 160*s + ' ' + 288*s + ' ' + 160*s + ' ' + 288*s + 'Z';

    shimmerEl.style.clipPath = "path('" + p + "')";
  }

  /* ==========================================================
     CANVAS SIZING
     ========================================================== */
  function sizeCanvas (force) {
    var rect = wrapEl.getBoundingClientRect();
    if (!rect.width) return;

    if (!force && Math.abs(rect.width - lastWidth) < 1) return;
    lastWidth = rect.width;

    dpr = Math.min(window.devicePixelRatio || 1, DPR_CAP);

    cvs.width  = Math.round(SVG_W * dpr);
    cvs.height = Math.round(SVG_H * dpr);
    cvs.style.width  = rect.width  + 'px';
    cvs.style.height = rect.height + 'px';

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    if (!revealed) {
      paintRoseGold();
      if (baselineClear < 0) baselineClear = measureClearRatio();
    }
  }

  /* ==========================================================
     ROSE-GOLD PAINT
     ========================================================== */
  function paintRoseGold () {
    ctx.save();
    ctx.clip(new Path2D(HEART_PATH));

    var g = ctx.createLinearGradient(0, 0, SVG_W, SVG_H);
    g.addColorStop(0.00, '#fce6d4');
    g.addColorStop(0.20, '#e8b898');
    g.addColorStop(0.42, '#d49a78');
    g.addColorStop(0.62, '#c47a58');
    g.addColorStop(0.82, '#d49a80');
    g.addColorStop(1.00, '#e8b898');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, SVG_W, SVG_H);

    for (var i = 0; i < SVG_W; i += 2) {
      ctx.beginPath();
      ctx.moveTo(i, 0);
      ctx.lineTo(i, SVG_H);
      ctx.strokeStyle = (i % 4 === 0)
        ? 'rgba(255,240,220,.12)'
        : 'rgba(120,60,30,.07)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    var rg = ctx.createRadialGradient(
      SVG_W * 0.32, SVG_H * 0.26, 0,
      SVG_W * 0.32, SVG_H * 0.26, SVG_W * 0.75
    );
    rg.addColorStop(0,   'rgba(255,240,220,.65)');
    rg.addColorStop(0.6, 'rgba(255,220,190,.16)');
    rg.addColorStop(1,   'rgba(255,220,190,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, SVG_W, SVG_H);

    var sg = ctx.createRadialGradient(
      SVG_W * 0.76, SVG_H * 0.84, 0,
      SVG_W * 0.76, SVG_H * 0.84, SVG_W * 0.7
    );
    sg.addColorStop(0, 'rgba(90,40,20,.22)');
    sg.addColorStop(1, 'rgba(90,40,20,0)');
    ctx.fillStyle = sg;
    ctx.fillRect(0, 0, SVG_W, SVG_H);

    ctx.restore();
    ctx.globalAlpha = 1;
  }

  /* ==========================================================
     SCRATCHING
     ========================================================== */
  function toCanvas (clientX, clientY) {
    var r = cvs.getBoundingClientRect();
    return {
      x: (clientX - r.left) * (SVG_W / r.width),
      y: (clientY - r.top)  * (SVG_H / r.height)
    };
  }

  function eraseDot (x, y) {
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.arc(x, y, BRUSH_RADIUS, 0, Math.PI * 2);
    ctx.fillStyle = '#000';
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }

  function eraseLine (a, b) {
    var dx = b.x - a.x;
    var dy = b.y - a.y;
    var dist  = Math.sqrt(dx * dx + dy * dy);
    var steps = Math.max(1, Math.ceil(dist / (BRUSH_RADIUS * 0.4)));

    for (var i = 1; i <= steps; i++) {
      var t = i / steps;
      eraseDot(a.x + dx * t, a.y + dy * t);
    }
  }

  /* ==========================================================
     PROGRESS
     ========================================================== */
  function measureClearRatio () {
    var data;
    try {
      data = ctx.getImageData(0, 0, cvs.width, cvs.height).data;
    } catch (e) { return 0; }

    var clear = 0, total = 0;
    for (var i = 3; i < data.length; i += 32) {
      total++;
      if (data[i] < 16) clear++;
    }
    return total ? clear / total : 0;
  }

  function scratchedRatio () {
    var clearRatio = measureClearRatio();
    if (baselineClear < 0) return 0;

    var painted = 1 - baselineClear;
    if (painted <= 0.01) return 0;

    return Math.max(0, (clearRatio - baselineClear) / painted);
  }

  function maybeCheckDone () {
    if (revealed) return;
    var now = Date.now();
    if (now - lastCheckTime < CHECK_INTERVAL) return;
    lastCheckTime = now;
    if (scratchedRatio() >= REVEAL_THRESHOLD) reveal();
  }

  /* ==========================================================
     REVEAL
     ========================================================== */
  function reveal () {
    if (revealed) return;
    revealed = true;
    isDrawing = false;

    ctx.clearRect(0, 0, cvs.width, cvs.height);
    cvs.style.display = 'none';

    hintEl.classList.add('is-hidden');
    hintEl.style.animation = 'none';
    hintEl.style.opacity = '0';

    shimmerEl.style.animation = 'none';
    shimmerEl.style.opacity   = '0';
    shimmerEl.style.display   = 'none';

    if (!prefersReduced) launchConfetti();

    liveEl.textContent =
      'Revealed — 14 September 2026, Paris, France. Formal invitation to follow.';
  }

  /* ==========================================================
     POINTER INPUT
     ========================================================== */
  if (window.PointerEvent) {
    cvs.addEventListener('pointerdown', function (e) {
      if (revealed) return;
      e.preventDefault();
      try { cvs.setPointerCapture(e.pointerId); } catch (err) {}
      isDrawing = true;
      lastPoint = toCanvas(e.clientX, e.clientY);
      eraseDot(lastPoint.x, lastPoint.y);
      maybeCheckDone();
    });

    cvs.addEventListener('pointermove', function (e) {
      if (!isDrawing || revealed) return;
      e.preventDefault();
      var p = toCanvas(e.clientX, e.clientY);
      eraseLine(lastPoint, p);
      lastPoint = p;
      maybeCheckDone();
    });

    function endStroke (e) {
      if (!isDrawing) return;
      isDrawing = false;
      lastPoint = null;
      try { cvs.releasePointerCapture(e.pointerId); } catch (err) {}
      maybeCheckDone();
    }
    cvs.addEventListener('pointerup', endStroke);
    cvs.addEventListener('pointercancel', endStroke);

  } else {
    cvs.addEventListener('mousedown', function (e) {
      if (revealed) return;
      e.preventDefault();
      isDrawing = true;
      lastPoint = toCanvas(e.clientX, e.clientY);
      eraseDot(lastPoint.x, lastPoint.y);
      maybeCheckDone();
    });
    window.addEventListener('mousemove', function (e) {
      if (!isDrawing || revealed) return;
      var p = toCanvas(e.clientX, e.clientY);
      eraseLine(lastPoint, p);
      lastPoint = p;
      maybeCheckDone();
    });
    window.addEventListener('mouseup', function () {
      isDrawing = false; lastPoint = null; maybeCheckDone();
    });

    cvs.addEventListener('touchstart', function (e) {
      if (revealed) return;
      e.preventDefault();
      isDrawing = true;
      var t = e.touches[0];
      lastPoint = toCanvas(t.clientX, t.clientY);
      eraseDot(lastPoint.x, lastPoint.y);
      maybeCheckDone();
    }, { passive: false });

    cvs.addEventListener('touchmove', function (e) {
      if (!isDrawing || revealed) return;
      e.preventDefault();
      var t = e.touches[0];
      var p = toCanvas(t.clientX, t.clientY);
      eraseLine(lastPoint, p);
      lastPoint = p;
      maybeCheckDone();
    }, { passive: false });

    cvs.addEventListener('touchend', function () {
      isDrawing = false; lastPoint = null; maybeCheckDone();
    });
  }

  /* ==========================================================
     KEYBOARD (heart)
     ========================================================== */
  wrapEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
      e.preventDefault();
      reveal();
    }
  });

  /* ==========================================================
     CONFETTI
     ========================================================== */
  function launchConfetti () {
    if (prefersReduced) return;

    var cc = document.getElementById('confetti');
    var cx = cc.getContext('2d');

    var W = window.innerWidth;
    var H = window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, DPR_CAP);

    cc.width  = Math.round(W * dpr);
    cc.height = Math.round(H * dpr);
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var palette = [
      '#fce6d4', '#f5c8a8', '#e8b898', '#d49a78',
      '#c47a58', '#e8d8b8', '#f5eede', '#ffffff',
      '#d8c8a0', '#e8b880', '#f0d4b4', '#c49a70'
    ];

    var pieces = [];
    for (var i = 0; i < 140; i++) {
      pieces.push({
        x: Math.random() * W,
        y: -20 - Math.random() * 220,
        vy: Math.random() * 1.6 + 0.55,
        vx: (Math.random() - 0.5) * 1.2,
        w: Math.random() * 11 + 3,
        h: Math.random() * 5 + 1.5,
        rot: Math.random() * Math.PI * 2,
        rv: (Math.random() - 0.5) * 0.08,
        color: palette[Math.floor(Math.random() * palette.length)],
        alpha: Math.random() * 0.55 + 0.45,
        drift: Math.random() * Math.PI * 2,
        ds: Math.random() * 0.022 + 0.009,
        shape: Math.random() > 0.45 ? 0 : 1
      });
    }

    var frame = 0;
    var maxFrames = 400;

    (function draw () {
      cx.clearRect(0, 0, W, H);
      var fade = Math.max(0, 1 - frame / maxFrames);

      for (var i = 0; i < pieces.length; i++) {
        var p = pieces[i];

        cx.save();
        cx.globalAlpha = p.alpha * fade;
        cx.translate(p.x, p.y);
        cx.rotate(p.rot);
        cx.fillStyle = p.color;

        if (p.shape === 0) {
          cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        } else {
          cx.beginPath();
          cx.arc(0, 0, p.h, 0, Math.PI * 2);
          cx.fill();
        }
        cx.restore();

        p.y += p.vy;
        p.x += p.vx + Math.sin(p.drift) * 0.55;
        p.rot += p.rv;
        p.drift += p.ds;

        if (p.y > H + 20) {
          p.y = -20;
          p.x = Math.random() * W;
        }
      }

      frame++;
      if (frame < maxFrames) {
        requestAnimationFrame(draw);
      } else {
        cx.clearRect(0, 0, W, H);
      }
    })();
  }

  /* ==========================================================
     INIT + RESIZE
     ========================================================== */
  function init () {
    updateShimmerClip();
    sizeCanvas(true);
  }

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () {
      updateShimmerClip();
      sizeCanvas(true);
    });
  }

  window.addEventListener('orientationchange', function () {
    setTimeout(function () { updateShimmerClip(); sizeCanvas(true); }, 220);
  });

  var resizeTimer;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      updateShimmerClip();
      sizeCanvas(false);
    }, 140);
  });

  if (window.ResizeObserver) {
    new ResizeObserver(function () { updateShimmerClip(); }).observe(wrapEl);
  }

  /* Paint the heart immediately so it is ready behind the intro */
  init();

})();
</script>
